<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WebOS</title>
    <meta name="description" content="Operating System for the web">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="theme-color" content="#17252C">
  </head>
  <body style="margin: 0; background: #17252c">
    <div
      id="splash"
      style="position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #17252c"
    >
      <img src="/logo.svg" alt="lilBunnyRabbit" width="96" height="96" />
      <div
        id="splash-progress"
        style="position: absolute; top: calc(50% + 80px); left: 50%; translate: -50% 0; display: grid; justify-items: center; gap: 12px; width: 160px"
      >
        <div style="width: 100%; height: 3px; border-radius: 9999px; overflow: hidden; background: oklch(0.357 0.0326 230.47)">
          <div
            id="splash-bar"
            style="height: 100%; transform: scaleX(0); transform-origin: left; background: oklch(0.745 0.0699 122.47); transition: transform 150ms ease-out"
          ></div>
        </div>
        <span
          id="splash-label"
          style="font: 12px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.02em; color: oklch(0.745 0.0078 50.47)"
          >Loading</span
        >
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
