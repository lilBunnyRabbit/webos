    <script>
      (() => {
        const id = "G-YZEVME6886";
        // Development and local previews never reach the real property; analytics.ts no-ops without gtag.
        if ("%DEV%" === "true" || ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) return;
        // gtag only exists once the visitor allowed it: no pings before the answer, none after a decline (ADR-070).
        window.webos_load_analytics = () => {
          if (window.gtag) return;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            dataLayer.push(arguments);
          };
          gtag("consent", "default", {
            analytics_storage: "granted",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied",
          });
          gtag("js", new Date());
          // The hash and query can carry app props and file paths (#/app/{id}?path=…); only the page itself is sent.
          gtag("config", id, { page_location: location.origin + location.pathname });
          const script = document.createElement("script");
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
          document.head.append(script);
        };
        let answer = null;
        try {
          answer = localStorage.getItem("webos.analytics");
        } catch {}
        if (answer === "allowed") window.webos_load_analytics();
      })();
    </script>
  </head>
  <body style="margin: 0; background: #17252c">
    <div
      id="splash"
      style="position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #17252c"
    >

      <div
        id="splash-progress"
        style="position: absolute; top: calc(50% + 80px); left: 50%; translate: -50% 0; display: grid; justify-items: center; gap: 12px; width: 160px"
      >
        <div style="width: 100%; height: 3px; border-radius: 9999px; overflow: hidden; background: oklch(0.357 0.0326 230.47)">
          <div
            id="splash-bar"
            style="height: 100%; transform: scaleX(0); transform-origin: left; background: oklch(0.745 0.0699 122.47); transition: transform 150ms ease-out"
          ></div>
        </div>
        <span
          id="splash-label"
          style="font: 12px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.02em; color: oklch(0.745 0.0078 50.47)"
          >Loading</span
        >
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
