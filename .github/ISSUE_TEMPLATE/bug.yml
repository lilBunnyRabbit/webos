name: Bug report
description: Something in WebOS doesn't work
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Which app or part of WebOS
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Version
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Desktop or mobile, and the browser
