# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['master']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # The fork promise: deleting every user app still leaves a working OS.
  fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Delete user apps
        run: rm -rf src/lib/apps/user

      - name: Check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Core browser tests
        run: bunx vitest run --project browser src/lib/core src/lib/kit src/lib/apps/system

      - name: Build
        run: bun run build

  deploy:
    needs: fork
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Check
        run: bun run check

      # ADR-027: unit tests gate the deploy. Browser tests need Playwright and run locally for now.
      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Boot budget
        run: bun run budget
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # Posts releases newer than the latest v* tag to Discord, then tags the newest. Without the secret it only prints.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Post to Discord
        run: bun scripts/discord-release.ts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
